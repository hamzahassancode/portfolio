# Dev datasource — H2 in-memory
spring.datasource.url=jdbc:h2:mem:portfoliodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Liquibase manages the schema; skip Hibernate validation (H2 maps TEXT→CLOB, not VARCHAR)
spring.jpa.hibernate.ddl-auto=none
spring.liquibase.enabled=true
